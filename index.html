<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#333333">
<title>Food Picker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
    }

    .container {
        text-align: center;
        width: 100%;
        max-width: 520px;
    }

    h1 {
        font-size: clamp(30px, 8vw, 40px);
        margin: 0 0 8px;
    }

    .subtitle {
        margin: 0 0 20px;
        color: #777;
        font-size: 15px;
    }

    .wheel-container {
        position: relative;
        width: min(90vw, 450px);
        height: min(90vw, 450px);
        margin: 0 auto 25px;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        box-shadow:
            0 12px 30px rgba(0, 0, 0, 0.18),
            0 0 0 8px #333;
        background: white;
    }

    /* Arrow pointing at the winning section */
    .pointer {
        position: absolute;
        top: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 18px solid transparent;
        border-right: 18px solid transparent;
        border-top: 0;
        border-bottom: 32px solid #333;
        z-index: 5;
        filter: drop-shadow(0 3px 2px rgba(0,0,0,0.2));
    }

    .pointer::after {
        content: "";
        position: absolute;
        left: -8px;
        top: 7px;
        width: 16px;
        height: 16px;
        background: #333;
        border-radius: 50%;
    }

    #food {
        min-height: 70px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: clamp(23px, 6vw, 32px);
        font-weight: bold;
        margin-bottom: 18px;
        padding: 0 10px;
    }

    #food.placeholder {
        color: #777;
        font-size: 21px;
    }

    button {
        width: 100%;
        padding: 20px;
        font-size: 22px;
        font-weight: bold;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        background: #333;
        color: white;
        transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active {
        transform: scale(0.98);
    }

    button:disabled {
        opacity: 0.7;
        cursor: default;
    }

    .hint {
        margin-top: 10px;
        color: #999;
        font-size: 12px;
    }

    .reminder {
        margin-top: 20px;
        font-size: 15px;
        color: #777;
        line-height: 1.4;
    }
</style>
</head>

<body>

<div class="container">

    <h1>What should we eat?</h1>
    <p class="subtitle">Let the wheel decide!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
    </div>

    <div id="food" class="placeholder">Spin the wheel!</div>

    <button id="spinButton">🎡 SPIN THE WHEEL</button>

    <div class="hint">Double-click the button for an instant answer.</div>

    <div class="reminder">
        Remember, always do what's easiest for you!
    </div>

</div>

<script>
const foods = [
    "Arayis",
    "Mahshi qusa wa bitinjan",
    "Mlokhiya",
    "Mjadara",
    "Pizza",
    "Panini",
    "Chicken curry",
    "Chicken biryani",
    "Shish tawooq",
    "Chinese Chicken stir fry",
    "Normal Chinese Chicken",
    "Imm fadis thing",
    "Basilla wa ruz",
    "Mac and bechamel",
    "Makbous fish",
    "Makbous Chicken",
    "Sabanikh and ruz",
    "Sfeeha and the cheese",
    "Batata and Egg",
    "Pot pie",
    "Kofta the square with potato and tomato",
    "Kofta skewer",
    "White Beans and rice (with meat (optional))",
    "Fasulya wa ruz",
    "Bamiya wa ruz",
    "Chicken pizza sandwich thing",
    "Ruz oozy",
    "Lasagna",
    "Tacos",
    "Burritos",
    "Fajitas",
    "Qusa bi laban",
    "Waraq 3nab",
    "Shawarma Jaj",
    "Shawarma Lahm",
    "Hamburgers",
    "BFC",
    "Grilled Chicken sandwiches",
    "Ravioli",
    "Macaroni",
    "Egg Pizza",
    "Manakish",
    "Lomain",
    "Chicken Alfredo",
    "Maftoul",
    "Musakhan",
    "Maqluba",
    "Zahra",
    "Quesadilla burger (only if it is easy to make)",
    "Hot dogs"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const foodDisplay = document.getElementById("food");
const spinButton = document.getElementById("spinButton");

let rotation = 0;
let spinning = false;

function setupCanvas() {
    const size = canvas.clientWidth;
    const dpr = window.devicePixelRatio || 1;

    canvas.width = size * dpr;
    canvas.height = size * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawWheel();
}

function drawWheel() {
    const size = canvas.clientWidth;
    const center = size / 2;
    const radius = size / 2 - 4;
    const slice = (Math.PI * 2) / foods.length;

    ctx.clearRect(0, 0, size, size);

    for (let i = 0; i < foods.length; i++) {
        const startAngle = rotation + i * slice;
        const endAngle = startAngle + slice;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();

        /*
         * Alternate light shades so the wheel sections are easy
         * to distinguish without making the wheel too busy.
         */
        ctx.fillStyle = i % 2 === 0 ? "#f2f2f2" : "#dcdcdc";
        ctx.fill();

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Food text
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + slice / 2);

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#222";
        ctx.font = `bold ${Math.max(9, Math.min(15, size / 29))}px Arial`;

        let text = foods[i];

        // Shorten extremely long names so they fit on the wheel.
        const maxLength = size < 350 ? 17 : 24;

        if (text.length > maxLength) {
            text = text.substring(0, maxLength - 1) + "…";
        }

        ctx.fillText(text, radius - 12, 0);

        ctx.restore();
    }

    // Center circle
    ctx.beginPath();
    ctx.arc(center, center, size * 0.075, 0, Math.PI * 2);
    ctx.fillStyle = "#333";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(center, center, size * 0.035, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
}

function getWinningFood() {
    /*
     * The pointer is at the top of the wheel.
     * Convert the top position into the corresponding section.
     */
    const slice = (Math.PI * 2) / foods.length;

    let pointerAngle = -Math.PI / 2;
    let adjusted = (pointerAngle - rotation + Math.PI * 2) % (Math.PI * 2);

    const index = Math.floor(adjusted / slice);

    return foods[index];
}

function showFood(food) {
    foodDisplay.classList.remove("placeholder");
    foodDisplay.textContent = "🍽️ " + food;
}

function spinWheel() {
    if (spinning) return;

    spinning = true;
    spinButton.disabled = true;

    /*
     * Choose a random amount of rotation.
     * Several full rotations make it look like a real wheel spin.
     */
    const extraTurns = 5 + Math.floor(Math.random() * 4);
    const randomOffset = Math.random() * Math.PI * 2;

    const startRotation = rotation;
    const targetRotation =
        rotation +
        extraTurns * Math.PI * 2 +
        randomOffset;

    const duration = 4200;
    const startTime = performance.now();

    function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Ease-out effect: fast at first, gradually slowing down.
        const eased = 1 - Math.pow(1 - progress, 4);

        rotation =
            startRotation +
            (targetRotation - startRotation) * eased;

        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            spinning = false;
            spinButton.disabled = false;

            const winner = getWinningFood();
            showFood(winner);
        }
    }

    requestAnimationFrame(animate);
}

function instantPick() {
    if (spinning) return;

    const randomIndex = Math.floor(Math.random() * foods.length);
    const winner = foods[randomIndex];

    showFood(winner);

    /*
     * Rotate the wheel so the selected food is also approximately
     * positioned underneath the pointer.
     */
    const slice = (Math.PI * 2) / foods.length;

    rotation =
        -Math.PI / 2 -
        (randomIndex * slice + slice / 2);

    drawWheel();
}

spinButton.addEventListener("click", spinWheel);
spinButton.addEventListener("dblclick", function(event) {
    event.preventDefault();
    instantPick();
});

window.addEventListener("resize", setupCanvas);

setupCanvas();
</script>

</body>
</html>
